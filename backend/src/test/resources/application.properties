# Use an in-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Use a simpler password encoder for tests to speed them up
spring.security.crypto.password.encoder=bcrypt

# Disable Flyway/Liquibase if they were active
spring.flyway.enabled=false
spring.liquibase.enabled=false

# Add missing properties required for application context to load
app.jwt.secret=test-secret-key-for-testing-purposes-only-1234567890
app.jwt.expiration-in-ms=3600000
mercadopago.access.token=TEST-MOCK-TOKEN
app.frontend.url=http://localhost:8080
app.admin.email=admin-test@example.com
app.admin.password=admin-test-password